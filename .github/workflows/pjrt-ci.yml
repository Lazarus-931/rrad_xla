name: PJRT CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Keep this pinned to the XLA commit that matches your PJRT C API bindings.
  XLA_COMMIT: d69d52a2d9140a1dafe3d044ab4dba27eba528ae

concurrency:
  group: pjrt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bindings_drift_check:
    name: PJRT Bindings Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev

      - name: Install bindgen CLI
        run: cargo install --locked bindgen-cli

      - name: Fetch XLA (Pinned)
        run: |
          rm -rf xla
          git init xla
          cd xla
          git remote add origin https://github.com/openxla/xla.git
          git fetch --depth 1 origin "${XLA_COMMIT}"
          git checkout FETCH_HEAD

      - name: Regenerate PJRT bindings from pinned XLA
        run: ./gen_bindings.sh xla/xla/pjrt/c/pjrt_c_api.h crates/rrad_pjrt/src/ffi/pjrt_bindings.rs

      - name: Verify bindings are up to date
        run: |
          if ! git diff --exit-code -- crates/rrad_pjrt/src/ffi/pjrt_bindings.rs crates/rrad_pjrt/PJRT_BINDING_DIFF.md; then
            echo "::error::PJRT bindings outputs are out of date. Run ./gen_bindings.sh xla/xla/pjrt/c/pjrt_c_api.h crates/rrad_pjrt/src/ffi/pjrt_bindings.rs and commit both crates/rrad_pjrt/src/ffi/pjrt_bindings.rs and crates/rrad_pjrt/PJRT_BINDING_DIFF.md."
            exit 1
          fi

  rust_tests:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cargo Test
        run: cargo test --manifest-path crates/rrad_pjrt/Cargo.toml --all-targets

      - name: Validate Test Scripts
        if: runner.os != 'Windows'
        run: |
          bash -n crates/rrad_pjrt/tests/scripts/common.sh crates/rrad_pjrt/tests/scripts/run_pjrt_loader_smoke.sh crates/rrad_pjrt/tests/scripts/run_pjrt_cpu_runtime_test.sh

  pjrt_loader_integration:
    name: PJRT Loader Integration (macOS)
    runs-on: macos-14
    needs: rust_tests
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bazelisk
        run: brew install bazelisk

      - name: Fetch XLA (Pinned)
        run: |
          rm -rf xla
          git init xla
          cd xla
          git remote add origin https://github.com/openxla/xla.git
          git fetch --depth 1 origin "${XLA_COMMIT}"
          git checkout FETCH_HEAD

      - name: Patch XLA For OSS Rules (strict_deps)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("xla/xla/tsl/tsl.bzl")
          txt = path.read_text(encoding="utf-8")
          if "strict_deps" not in txt:
              print("No strict_deps found; skipping patch.")
              raise SystemExit(0)
          lines = txt.splitlines(True)
          new_lines = [ln for ln in lines if "strict_deps" not in ln]
          path.write_text("".join(new_lines), encoding="utf-8")
          print("Patched:", path)
          PY

      - name: Build PJRT CPU Plugin
        run: |
          PYBIN="$(command -v python3)"
          SDK_VER="$(xcrun --show-sdk-version --sdk macosx)"
          echo "Using python ${PYBIN}"
          echo "Using macOS SDK ${SDK_VER}"
          cd xla
          bazel build \
            --python_path="${PYBIN}" \
            --action_env=PYTHON_BIN_PATH="${PYBIN}" \
            --repo_env=PYTHON_BIN_PATH="${PYBIN}" \
            --macos_sdk_version="${SDK_VER}" \
            //xla/pjrt/c:pjrt_c_api_cpu_plugin.so

      - name: Run Rust PJRT Loader Smoke
        run: crates/rrad_pjrt/tests/scripts/run_pjrt_loader_smoke.sh

      - name: Run Bindings Tests
        run: |
          source crates/rrad_pjrt/tests/scripts/common.sh
          export PJRT_PLUGIN="$(resolve_pjrt_plugin_path)"
          cargo test --manifest-path crates/rrad_pjrt/Cargo.toml --test bindings_suite -- --nocapture

      - name: Run Rust PJRT CPU Runtime Test
        run: crates/rrad_pjrt/tests/scripts/run_pjrt_cpu_runtime_test.sh

