[package]
name = "rrad_pjrt"
version = "0.1.0"
edition = "2021"
description = "Experimental Rust foundations for XLA HLO/PJRT integration"
license = "Apache-2.0"
readme = "README.md"

[package.metadata.docs.rs]
all-features = false
no-default-features = true
features = []
rustdoc-args = ["--cfg", "docsrs"]



[lib]
name = "rrad_pjrt"
path = "src/lib.rs"

[[bin]]
name = "rrad_pjrt"
path = "src/main.rs"

[dependencies]
libc = "0.2.0"
libloading = "0.9.0"
log = "0.4.29"
thiserror = "2.0.18"

